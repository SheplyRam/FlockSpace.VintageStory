name: Release

on:
  release:
    types: [published]

env:
  DOTNET_VERSION: "10.0.x"
  # Must match the "game" dependency in each mod's modinfo.json
  VINTAGE_STORY_VERSION: "1.21.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the code the release points at, not the default branch
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The projects reference Vintage Story DLLs via the VINTAGE_STORY env var,
      # so download the server archive (contains API, Lib and stock mods) on the runner.
      - name: Download Vintage Story ${{ env.VINTAGE_STORY_VERSION }}
        run: |
          curl -fSL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VINTAGE_STORY_VERSION}.tar.gz" -o vs.tar.gz
          mkdir -p "$RUNNER_TEMP/vintagestory"
          tar -xzf vs.tar.gz -C "$RUNNER_TEMP/vintagestory"
          echo "VINTAGE_STORY=$RUNNER_TEMP/vintagestory" >> "$GITHUB_ENV"

      - name: Build and package
        run: dotnet run --project CakeBuild --configuration Release -- --target=Package

      - name: Attach mod zips to the release
        run: gh release upload "${{ github.event.release.tag_name }}" Releases/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub normally creates the tag automatically when the release is made;
      # create it here if it doesn't exist yet so the tag is an output of the release.
      - name: Ensure git tag exists
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch origin "refs/tags/$TAG" 2>/dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "${{ github.sha }}"
            git push origin "refs/tags/$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
